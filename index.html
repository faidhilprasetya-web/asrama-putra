<html lang="id">
<head>
<meta charset="utf-8">

<title>Monitoring Asrama</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--pri2:#1d4ed8;--pri3:#1e40af;--soft:#eff6ff;--bad:#e11d48;--warn:#f59e0b;--on:#fff;--ky:#f59e0b;--kyb:#fffbeb;--hj:#10b981;--hjb:#ecfdf5;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri2);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 6px #0003}
.hd{max-width:1024px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.br{display:flex;align-items:center;gap:8px}header h1{margin:0;font-size:1.1rem}
.hr{display:flex;gap:8px;align-items:center;font-size:12px}#st{font-size:11px;color:#dbeafe}
.hb,header select{background:var(--pri3);color:#fff;border:1px solid #3b82f6;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
header select option{color:#111;background:#fff}
.dnav{display:none;background:#1e40afe6;border-top:1px solid #2563eb80}
.dn{max-width:1024px;margin:0 auto;display:flex;gap:4px;padding:0 16px}
.dn button{background:none;border:0;border-bottom:2px solid transparent;color:#bfdbfe;padding:10px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.dn button.on{color:#fff;border-bottom-color:#fff}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 8px #0000001a}
#bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#94a3b8;font:inherit;font-size:10px;font-weight:600;cursor:pointer}
#bnav .ic{font-size:18px;line-height:1}.dn .ic{font-size:15px}#bnav button.on{color:var(--pri)}
@media(min-width:768px){.dnav{display:block}#bnav{display:none}}
@media(max-width:480px){#abtn .tx{display:none}}
main{max-width:1024px;margin:0 auto;padding:16px 16px 8px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:8px 14px calc(130px + env(safe-area-inset-bottom,0px))}footer a{color:var(--pri)}
@media(min-width:768px){footer{padding-bottom:90px}}
h2{margin:4px 0 10px;font-size:1.125rem}h3{margin:14px 0 8px;font-size:.9rem}.h2s{margin:2px 0 0;font-size:1rem}
.sm{font-size:12px;margin:0}.card>p.mut{margin:0}.mut{color:var(--mut);font-size:12px}
.rt{background:linear-gradient(90deg,var(--pri2),var(--pri));color:#fff;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:12px}
.rt .sm{color:#dbeafe;font-weight:500}.rt h2{font-size:1rem;margin:2px 0 0}.rtr{text-align:right}
.clock{font:700 1.5rem ui-monospace,Consolas,monospace;letter-spacing:.05em;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px #0000000d}
.card.ky{background:var(--kyb);border-color:#fde68a}.card.hj{background:var(--hjb);border-color:#a7f3d0}
.card.ky .mut{color:#b45309;font-weight:600}.card.hj .mut{color:#047857;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.g3 .card{margin:0;padding:12px}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:768px){.g4{grid-template-columns:repeat(4,1fr)}}
.big{font-size:1.5rem;font-weight:700}.g3 .mut{font-size:11px}
.bn,.tip{border-left:4px solid var(--pri);background:var(--soft);color:#1e3a8a;padding:12px 14px;border-radius:0 12px 12px 0;font-size:12px;margin-bottom:12px}
.bn.red{border-color:var(--bad);background:#fff1f2;color:#9f1239}.bn.ok{border-color:var(--hj);background:var(--hjb);color:#065f46}
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--soft);color:#1e3a8a;text-align:left;padding:12px;font-weight:700;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#334155}tr:last-child td{border-bottom:0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--pri)}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}.pill.g{background:var(--hjb);color:#047857}.pill.r{background:#fff1f2;color:#be123c}.pill.y{background:var(--kyb);color:#92400e}.pill.b{background:#dbeafe;color:#1d4ed8}.pill.c{background:#e7d3b8;color:#6b4423}.pill.n{background:#f1f5f9;color:#475569}details.card>summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center}details.card>summary b{margin-right:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;min-width:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.pri:hover{background:var(--pri2)}
.btn.sec{background:var(--soft);color:var(--pri3);border-color:#93c5fd}.btn.del{color:var(--bad)}
.stu{display:grid;gap:8px}.stu .nm,.nm{font-weight:700}.stu .mt{color:var(--mut);font-size:12px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.st{width:100%;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:6px 2px;font:inherit;font-size:11px;cursor:pointer;opacity:.6}
.st b{display:block;font-size:1.4rem;font-weight:400;line-height:1.2}
.st.on{opacity:1;border-color:var(--pri);background:var(--soft);font-weight:700}.st.on.bad{border-color:var(--bad);background:#fff1f2}.st.on.mid{border-color:var(--warn);background:var(--kyb)}
.stu input{width:100%}
.fab{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--pri);color:#fff;border:1px solid #60a5fa;border-radius:999px;padding:11px 18px;font:inherit;font-size:13px;font-weight:700;box-shadow:0 4px 14px #0004;cursor:pointer}
@media(min-width:768px){.fab{bottom:20px}}
.ov{position:fixed;inset:0;background:#0009;display:none;z-index:60;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.md{background:var(--bg);width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border-radius:16px 16px 0 0;box-shadow:0 10px 30px #0006}
@media(min-width:768px){.ov{align-items:center}.md{border-radius:16px}}
.mh{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:1rem}
.mh button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
#mn{display:flex;flex-wrap:wrap;flex:none;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
#mn button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
#mn button.on{color:#fff;background:var(--pri);border-color:var(--pri)}
#mb,#ab{padding:16px;overflow-y:auto;flex:1 1 auto;min-height:0}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:99;max-width:90vw;text-align:center}
.empty{padding:18px;text-align:center;color:var(--mut)}
.login{max-width:360px;margin:30px auto}.err{color:var(--bad);font-weight:600;min-height:1.4em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 p{margin:0}
.chk{display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;cursor:pointer;color:var(--ink);font-size:13px}
.chk input{width:20px;height:20px;flex:none}.chk .cn{flex:1;display:flex;flex-direction:column}.chk em{font-style:normal;color:var(--mut);font-size:12px}
.chk .cv{font-weight:700;color:var(--pri2);background:var(--soft);border-radius:8px;padding:2px 9px}
.chk:has(input:checked){border-color:#10b981;background:var(--hjb)}
details.card summary{cursor:pointer;font-weight:600}
.chk .seg{display:flex;gap:4px;flex:none}
.seg button{min-width:38px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button.on{color:#fff}.seg button.on.z{background:#64748b;border-color:#64748b}.seg button.on.p{background:#f59e0b;border-color:#f59e0b}.seg button.on.f{background:#10b981;border-color:#10b981}
.chk.full{border-color:#10b981;background:var(--hjb)}
.bn.yel{border-color:var(--ky);background:var(--kyb);color:#92400e}
.kgt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.kg .btn{padding:6px 10px}.btn:disabled{opacity:.4;cursor:default}
.savebar{position:sticky;bottom:-16px;margin:14px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 12px #0000001a;z-index:2}
.savebar .btn{width:100%;padding:13px;font-size:15px;box-shadow:0 2px 8px #2563eb55}
.adm{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#ecfdf5;border-bottom:1px solid #a7f3d0;font-size:12px;color:#065f46}.adm[hidden]{display:none}.adm .btn{padding:4px 10px}
</style>
</head>
<body>
<header>
 <div class="hd"><div class="br"><span style="font-size:1.5rem">🏠</span><h1>Monitoring Asrama</h1></div>
  <div class="hr"><button class="hb" id="abtn"><span aria-hidden="true">ℹ️</span> <span class="tx">Tentang</span></button>
   <select id="lang" aria-label="Bahasa"><option value="id">🇮🇩 Indonesia</option><option value="en">🇬🇧 English</option><option value="tr">🇹🇷 Türkçe</option></select>
   <span id="st"></span><button class="hb" id="out" hidden>Keluar</button></div></div>
 <div class="dnav"><nav id="nav" class="dn"></nav></div>
</header>
<main><section id="view"></section></main>
<footer id="ft"></footer>
<nav id="bnav"></nav>
<button class="fab" id="fab" hidden>＋ <span>Input Data</span></button>
<div class="ov" id="ov"><div class="md"><div class="mh"><b>Input Data</b><button id="mx" aria-label="Tutup">✕</button></div><nav id="mn"></nav><div id="admbar" class="adm" hidden><span>🔓 Mode admin</span> <button class="btn" id="adl">Kunci kembali</button></div><div id="mb"></div></div></div>
<div class="ov" id="abt"><div class="md"><div class="mh"><b>Tentang Aplikasi</b><button id="ax" aria-label="Tutup">✕</button></div><div id="ab"></div></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DEF_ACTS=[{nama:'Subuh',jenis:'sholat',shift:'pagi',auto:'Tidak sholat berjamaah'},{nama:'Tadarus Pagi',jenis:'biasa',shift:'pagi',auto:'Tidak mengikuti program tadarus'},{nama:'Magrib',jenis:'sholat',shift:'malam',auto:'Tidak sholat berjamaah'},{nama:'Isya',jenis:'sholat',shift:'malam',auto:'Tidak sholat berjamaah'},{nama:'Tadarus Magrib',jenis:'biasa',shift:'malam',auto:'Tidak mengikuti program tadarus'},{nama:'Belajar Mandiri',jenis:'biasa',shift:'malam',auto:'Tidak mengikuti belajar mandiri'},{nama:'Absensi Malam',jenis:'biasa',shift:'malam',auto:''}];
const actsList=()=>db.acts&&db.acts.length?db.acts:DEF_ACTS.map((a,i)=>({id:'d'+i,urut:i,...a}));
const ACTN=()=>actsList().map(a=>a.nama);
const actOf=n=>actsList().find(a=>a.nama===n)||null;
const isPray=n=>{const a=actOf(n);return !!a&&a.jenis==='sholat'};
const isMorning=n=>{const a=actOf(n);return !!a&&a.shift==='pagi'};
const ST={pray:[['Hadir','🕌','ok'],['Telat','⏰','mid'],['Izin','📝','mid'],['Sakit','🤒','mid'],['Alpa','❌','bad']],
 other:[['Hadir','✅','ok'],['Izin','📝','mid'],['Sakit','🤒','mid'],['Alpa','❌','bad']],
 two:[['Hadir','✅','ok'],['Alpa','❌','bad']],
 late:[['Hadir','✅','ok'],['Telat','⏰','mid'],['Izin','📝','mid'],['Sakit','🤒','mid'],['Alpa','❌','bad']]};
const stSet0=n=>{if(isPray(n))return ST.pray;const a=actOf(n);if(a&&a.jenis==='telat')return ST.late;return a&&(a.jenis==='dua'||a.nama==='Absensi Malam')?ST.two:ST.other};
const stSet=n=>{const r=stSet0(n);if(n==='Pengumpulan HP Pagi'&&!r.some(x=>x[0]==='Izin')){const c=r.slice();c.splice(c.length-1,0,['Izin','📝','mid']);return c}return r};
const GOOD=['Jamaah','Masbuk','Hadir'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)};

/* ---------- bahasa & kredit ---------- */
const CREDIT={nama:'Faidhil',tahun:2026};
const APP_VER='1.0';
const LANGS={id:'Indonesia',en:'English',tr:'Türkçe'};
let lang=LS('lang');if(!LANGS[lang])lang='id';
const D=new Map([["Hanya admin", ["Admins only", "Yalnızca yönetici"]],["Tab ini hanya bisa diisi oleh admin. Masukkan kode admin untuk membuka.", ["This tab can only be filled in by an admin. Enter the admin code to open it.", "Bu sekme yalnızca yönetici tarafından doldurulabilir. Açmak için yönetici kodunu girin."]],["Kode admin", ["Admin code", "Yönetici kodu"]],["Buka", ["Open", "Aç"]],["Kode admin salah.", ["Wrong admin code.", "Yönetici kodu yanlış."]],["Fitur admin belum aktif di database. Jalankan update-admin.sql di Supabase.", ["The admin feature is not active in the database yet. Run update-admin.sql in Supabase.", "Yönetici özelliği veritabanında henüz etkin değil. Supabase'de update-admin.sql dosyasını çalıştırın."]],["Tidak bisa terhubung. Coba lagi.", ["Cannot connect. Please try again.", "Bağlanılamadı. Lütfen tekrar deneyin."]],["🔓 Mode admin", ["🔓 Admin mode", "🔓 Yönetici modu"]],["Kunci kembali", ["Lock again", "Yeniden kilitle"]],["Hanya admin yang dapat mengubah data ini", ["Only an admin can change this data", "Bu veriyi yalnızca yönetici değiştirebilir"]],["✏️ Absensi untuk tanggal dan kegiatan ini sudah tersimpan. Perubahan akan menimpa data sebelumnya.", ["✏️ Attendance for this date and activity is already saved. Changes will overwrite the previous data.", "✏️ Bu tarih ve etkinlik için yoklama zaten kayıtlı. Değişiklikler önceki verilerin üzerine yazılır."]],["Kehadiran Etud hari ini", ["Study hall attendance today", "Bugünkü etüt yoklaması"]],["Semua siswa yang diabsen hadir.", ["All students recorded are present.", "Yoklaması alınan tüm öğrenciler mevcut."]],["Belum ada data absensi etud hari ini.", ["No study hall attendance recorded today.", "Bugün etüt yoklaması kaydedilmedi."]],["Rekap per siswa", ["Student summary", "Öğrenci özeti"]],["⬇ Unduh rekap siswa (Excel)", ["⬇ Download student summary (Excel)", "⬇ Öğrenci özetini indir (Excel)"]],["Edit", ["Edit", "Düzenle"]],["Batal", ["Cancel", "İptal"]],["Data siswa diperbarui", ["Student function tx(str){

 if(k.includes('; ')){const r=k.split('; ').map(x=>tx(x)).join('; ');return str.replace(k,()=>r)}

}

}

async function rpc(fn,body){
 const base=CFG.url.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''),key=CFG.key.trim();
 const h={apikey:key,'Content-Type':'application/json'};if(key.startsWith('eyJ'))h.Authorization='Bearer '+key;
 const r=await fetch(base+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)});
 const t=await r.text();
 if(!r.ok){const e=new Error(t);e.admin=t.includes('forbidden_admin');e.forbidden=!e.admin&&t.includes('forbidden');e.status=r.status;throw e}
 return t?JSON.parse(t):null;
}
function fromRows(rows){
 const d={students:[],att:{},piket:{},cats:[],cards:[],cfg:{},rooms:[],clean:{},acts:[]};
 rows.forEach(r=>{const k=r.key,id=k.slice(2);
  if(k[0]==='s')d.students.push({id,...r.value});else if(k[0]==='a')d.att[id]=r.value;else if(k[0]==='p')d.piket[id]={a:r.value.nama||'',b:r.value.nama2||''};else if(k[0]==='e')d.acts.push({id,...r.value});else if(k[0]==='g')d.cfg=r.value;else if(k[0]==='c')d.cats.push({id,...r.value});else if(k[0]==='k')d.cards.push({id,...r.value});else if(k[0]==='r')d.rooms.push({id,...r.value});else if(k[0]==='h')d.clean[id]=normC(r.value)});d.rooms.sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));d.acts.sort((a,b)=>(a.urut||0)-(b.urut||0));

function fAbsen(){
 if(!ACTN().includes(A.act))A.act=ACTN()[0]||'';
 $('#mb').innerHTML=`<div class="tip">Pilih tanggal, piket, dan kegiatan, lalu ketuk ikon status tiap siswa (ketuk lagi untuk batal), atau pakai "Isi Semua". Tekan Simpan Absensi agar terkirim ke semua perangkat.</div>

 <label>Piket Malam<input id="apk2" placeholder="Nama pembina" value="${esc(pkv(A.date,1))}"></label></div>
 <div class="row"><label>Kegiatan<select id="aa">${ACTN().map(a=>`<option value="${a}" ${a===A.act?'selected':''}>${a}</option>`).join('')}</select></label>

 <div class="row"><button class="btn pri" id="ashow">Tampilkan</button><button class="btn sec" id="aall">✓ Isi Semua</button></div>
 <div id="aedit"></div><div id="alist"></div>
 <div class="savebar"><button class="btn pri" id="asv">Simpan Absensi</button></div>`;
 const reset=()=>{A.shown=false;$('#alist').innerHTML=''};
 $('#ad').onchange=e=>{A.date=e.target.value;$('#apk').value=pkv(A.date,0);$('#apk2').value=pkv(A.date,1);reset()};
 $('#aa').onchange=e=>{A.act=e.target.value;reset()};
 $('#ak').onchange=e=>{A.kelas=e.target.value;reset()};
 const sp=()=>{const a=$('#apk').value.trim(),b=$('#apk2').value.trim();if(a!==pkv(A.date,0)||b!==pkv(A.date,1))setPiket(A.date,a,b)};$('#apk').onchange=sp;$('#apk2').onchange=sp;
 $('#ashow').onclick=()=>{loadDraft();aList()};
 $('#aall').onclick=()=>{if(!A.shown)loadDraft();const f=stSet(A.act)[0][0];shownStudents().forEach(s=>{A.draft[s.id]={s:f,n:(A.draft[s.id]||{}).n||''}});aList()};
 $('#asv').onclick=()=>{
  if(!A.shown){toast('Tekan Tampilkan dulu');return}
  const p1=$('#apk').value.trim(),p2=$('#apk2').value.trim(),mor=isMorning(A.act),pk=mor?p1:p2;
  if(!pk){toast(mor?'Isi nama piket pagi dulu':'Isi nama piket malam dulu');(mor?$('#apk'):$('#apk2')).focus();return}
  sp();
  const it=[];
  shownStudents().forEach(s=>{const k=A.date+'|'+A.act+'|'+s.id,r=A.draft[s.id];
   if(r&&r.s){const v={s:r.s,n:r.n||'',by:pk};db.att[k]=v;it.push({key:'a:'+k,value:v})}
   else if(db.att[k]){delete db.att[k];it.push({key:'a:'+k,value:null})}});
  shownStudents().forEach(s=>{const r=A.draft[s.id],nm=r&&r.s?autoCat(A.act,r.s):null,id='auto|'+A.date+'|'+A.act+'|'+s.id,ix=db.cards.findIndex(c=>c.id===id);
   if(nm){const c=ensureCat(nm),v={tgl:A.date,sid:s.id,tipe:'kuning',kat:c.nama,poin:c.poin==null?1:c.poin,n:'Auto · '+A.act+' · '+r.s,by:pk,auto:1};
    if(ix>=0)db.cards[ix]={id,...v};else db.cards.push({id,...v});it.push({key:'k:'+id,value:v})}
   else if(ix>=0){db.cards.splice(ix,1);it.push({key:'k:'+id,value:null})}});
  if(it.length)sync(it);flush().then(()=>toast(q.length?'Tersimpan di HP, dikirim saat online'+(LASTERR?' — Error: '+LASTERR:''):'Absensi tersimpan'))};
 if(A.shown)aList();
}
function aList(){
 const n0=shownStudents().filter(x=>rec(A.date,A.act,x.id)).length;$('#aedit').innerHTML=n0?'<div class="bn">✏️ Absensi untuk tanggal dan kegiatan ini sudah tersimpan. Perubahan akan menimpa data sebelumnya.</div>':'';
 const set=stSet(A.act),ss=shownStudents();
 if(!ss.length){$('#alist').innerHTML='<div class="empty">Belum ada siswa. Tambahkan di tab Siswa.</div>';return}

  return `<div class="card stu" data-id="${s.id}"><div><span class="nm">${esc(s.nama)}</span><div class="mt">Kelas ${esc(s.kelas)} · Kamar ${esc(s.kamar||'-')}</div></div>
  <div class="sts">${set.map(x=>`<button class="st ${x[2]} ${r.s===x[0]?'on':''}" data-s="${x[0]}"><b>${x[1]}</b>${x[0]}</button>`).join('')}</div>
  <input placeholder="Catatan" value="${esc(r.n||'')}"></div>`}).join('');
}
$('#mb').addEventListener('click',e=>{
 const b=e.target.closest('.st');if(!b||mt!=='Absensi')return;
 const id=b.closest('.stu').dataset.id,cur=A.draft[id]||{s:'',n:''};
 A.draft[id]={s:cur.s===b.dataset.s?'':b.dataset.s,n:cur.n||''};aList();
});
$('#mb').addEventListener('input',e=>{
 if(mt!=='Absensi'||!e.target.closest('.stu'))return;
 const id=e.target.closest('.stu').dataset.id,cur=A.draft[id]||{s:'',n:''};cur.n=e.target.value;A.draft[id]=cur;
});

/* kartu kuning / hijau (English only) */
function fKartu(){
 if(!db.students.some(s=>s.id===K.sid))K.sid=(db.students[0]||{}).id||'';
 const cs=db.cats.filter(c=>c.tipe===K.tipe);
 K.f=K.f||'';K.edit=K.edit||'';
 const recent=[...db.cards].filter(c=>!K.f||c.sid===K.f).sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,30).map(c=>{const s=db.students.find(x=>x.id===c.sid),au=String(c.id).startsWith('auto|');
  return `<tr><td>${c.tgl}</td><td>${s?esc(s.nama):'-'}</td><td>${jenis(c.tipe)}</td><td>${esc(c.kat)}</td><td>${fp(pt(c))}</td><td>${au?'<span class="mut">Auto</span> ':`<button class="btn" data-kedit="${esc(c.id)}">Edit</button> `}<button class="btn del" data-kdel="${esc(c.id)}">Delete</button></td></tr>`}).join('');
 const ec=K.edit?db.cards.find(c=>c.id===K.edit):null,ecs=ec?db.cats.filter(c=>c.tipe===ec.tipe&&c.nama!==ec.kat):[];
 const editHtml=ec?`<div class="card" style="border-color:var(--pri)"><b>Edit card · ${esc((db.students.find(x=>x.id===ec.sid)||{}).nama||'-')} · ${jenis(ec.tipe)}</b>
 <div class="row" style="margin-top:8px"><label>Date<input type="date" id="ed" value="${ec.tgl}"></label><label>Category<select id="ek"><option value="__cur">${esc(ec.kat)} (${ec.poin==null?1:ec.poin} pts)</option>${ecs.map(c=>`<option value="${c.id}">${esc(c.nama)} (${c.poin==null?1:c.poin} pts)</option>`).join('')}</select></label></div>
 <div class="row"><label style="flex:1">Note<input id="en2" value="${esc(ec.n||'')}"></label></div>
 <div class="row"><button class="btn pri" id="eup">Update</button><button class="btn" id="ecn2">Cancel</button></div></div>`:'';
 $('#mb').innerHTML=`<div data-nt>${editHtml}<div class="row"><label>Date<input type="date" id="kd" value="${K.tgl}"></label>
 <label>Student<select id="ks">${db.students.map(s=>`<option value="${s.id}" ${s.id===K.sid?'selected':''}>${esc(s.nama)} (${esc(s.kelas)})</option>`).join('')||'<option value="">(no students yet)</option>'}</select></label></div>
 <div class="row"><label>Type<select id="kj"><option value="kuning" ${K.tipe==='kuning'?'selected':''}>🟨 Yellow Card</option><option value="hijau" ${K.tipe==='hijau'?'selected':''}>🟩 Green Card</option></select></label>
 <label>Category<select id="kc">${cs.map(c=>`<option value="${c.id}">${esc(c.nama)} (${c.poin==null?1:c.poin} pts)</option>`).join('')||'<option value="">(none yet)</option>'}</select></label></div>
 ${cs.length?'':'<div class="tip">No categories for this type yet. Add one first in the Categories tab.</div>'}
 <div class="row"><label style="flex:1">Note<input id="kn"></label></div>
 <div class="row"><label>Supervisor<input id="kp" value="${esc(pkTxt(K.tgl))}"></label><button class="btn pri" id="ksv">Save card</button></div>
 <h3>Latest cards</h3><div class="row"><label>Show cards of<select id="kf"><option value="">All students</option>${db.students.map(s=>`<option value="${s.id}" ${s.id===K.f?'selected':''}>${esc(s.nama)} (${esc(s.kelas)})</option>`).join('')}</select></label></div>
 ${recent?`<div class="tw"><table style="min-width:0"><tr><th>Date</th><th>Student</th><th>Type</th><th>Category</th><th>Points</th><th></th></tr>${recent}</table></div>`:'<div class="empty">No cards yet.</div>'}</div>`;
 $('#kd').onchange=e=>{K.tgl=e.target.value;$('#kp').value=pkTxt(K.tgl)};
 $('#ks').onchange=e=>{K.sid=e.target.value};
 $('#kj').onchange=e=>{K.tipe=e.target.value;fKartu()};
 $('#ksv').onclick=()=>{
  const sid=$('#ks').value,c=db.cats.find(x=>x.id===$('#kc').value);
  if(!sid){toast('Choose a student first');return}
  if(!c){toast('Choose a category first (add one in the Categories tab)');return}
  addCard({tgl:K.tgl,sid,tipe:K.tipe,kat:c.nama,poin:c.poin==null?1:c.poin,n:$('#kn').value.trim(),by:$('#kp').value.trim()});
  toast('Card saved');fKartu()};
 $('#mb').querySelectorAll('[data-kdel]').forEach(b=>b.onclick=()=>{if(confirm('Delete this card?')){delCard(b.dataset.kdel);fKartu()}});
 $('#kf').onchange=e=>{K.f=e.target.value;fKartu()};
 $('#mb').querySelectorAll('[data-kedit]').forEach(b=>b.onclick=()=>{K.edit=b.dataset.kedit;fKartu();$('#mb').scrollTop=0});
 if(ec){$('#ecn2').onclick=()=>{K.edit='';fKartu()};
  $('#eup').onclick=()=>{const v=$('#ek').value,nc=v==='__cur'?null:db.cats.find(c=>c.id===v);ec.tgl=$('#ed').value||ec.tgl;if(nc){ec.kat=nc.nama;ec.poin=nc.poin==null?1:nc.poin}ec.n=$('#en2').value.trim();
   sync([{key:'k:'+ec.id,value:{tgl:ec.tgl,sid:ec.sid,tipe:ec.tipe,kat:ec.kat,poin:ec.poin,n:ec.n,by:ec.by||''}}]);K.edit='';toast('Card updated');fKartu()}}
}

/* kegiatan */
const saveAct=a=>({key:'e:'+a.id,value:{nama:a.nama,jenis:a.jenis,shift:a.shift,auto:a.auto||'',urut:a.urut,sorot:a.sorot||''}});
function matAct(){if(!db.acts.length){db.acts=DEF_ACTS.map((a,i)=>({id:nid(),urut:i,...a}));sync(db.acts.map(saveAct))}}
const actByName=n=>{matAct();return db.acts.find(x=>x.nama===n)};
function moveAct(n,d){matAct();db.acts.sort((a,b)=>a.urut-b.urut);const i=db.acts.findIndex(x=>x.nama===n),j=i+d;if(i<0||j<0||j>=db.acts.length)return;
 const t=db.acts[i].urut;db.acts[i].urut=db.acts[j].urut;db.acts[j].urut=t;db.acts.sort((a,b)=>a.urut-b.urut);sync([saveAct(db.acts[i]),saveAct(db.acts[j])])}
function renameAct(old,nn){
 const a=actByName(old);if(!a)return;
 const up=[],del=[];
 Object.keys(db.att).forEach(k=>{const p=k.split('|');if(p[1]!==old)return;const nk=p[0]+'|'+nn+'|'+p[2],v=db.att[k];db.att[nk]=v;delete db.att[k];up.push({key:'a:'+nk,value:v});del.push({key:'a:'+k,value:null})});
 db.cards.forEach(c=>{if(c.auto&&typeof c.id==='string'&&c.id.startsWith('auto|')){const p=c.id.split('|');if(p[2]!==old)return;const oid=c.id;c.id='auto|'+p[1]+'|'+nn+'|'+p[3];if(c.n)c.n=c.n.split(' · ').map((x,i)=>i===1&&x===old?nn:x).join(' · ');const {id,...v}=c;up.push({key:'k:'+c.id,value:v});del.push({key:'k:'+oid,value:null})}});
 a.nama=nn;if(A.act===old)A.act=nn;if(R.act===old)R.act=nn;
 const items=[saveAct(a),...up,...del];
 SEQ++;for(let i=0;i<items.length;i+=300)q.push(items.slice(i,i+300));
 LS('q',q);LS('db',db);setSt();flush();
}
const ORD=['Subuh','Tadarus Pagi','Ngaji Pagi','Pengumpulan HP Pagi','Keberangkatan Sekolah','Magrib','Isya','Tadarus Magrib','Ngaji Magrib','Belajar Mandiri','Belajar Malam','Absensi Malam'];
function orderActs(){matAct();const ix=a=>{const i=ORD.indexOf(a.nama);return i<0?100+(a.urut||0):i};
 db.acts.sort((a,b)=>ix(a)-ix(b));db.acts.forEach((a,i)=>a.urut=i);sync(db.acts.map(saveAct))}
const LEG={'Ngaji Pagi':'Tadarus Pagi','Ngaji Magrib':'Tadarus Magrib','Belajar Malam':'Belajar Mandiri'};
function fKeg(){
 const l=actsList(),pend=l.filter(a=>LEG[a.nama]&&!l.some(x=>x.nama===LEG[a.nama]));
 const rows=l.map((a,i)=>`<div class="card kg" data-n="${esc(a.nama)}"><div class="kgt"><input data-rn value="${esc(a.nama)}" aria-label="Nama kegiatan" style="font-weight:700;flex:1;min-width:0"><span><button class="btn" data-up ${i?'':'disabled'}>▲</button> <button class="btn" data-dn ${i<l.length-1?'':'disabled'}>▼</button> <button class="btn del" data-kdel2>Hapus</button></span></div>
 <div class="row" style="margin:0"><label>Jenis<select data-f="jenis"><option value="sholat" ${a.jenis==='sholat'?'selected':''}>Sholat</option><option value="biasa" ${a.jenis==='biasa'?'selected':''}>Biasa</option><option value="dua" ${a.jenis==='dua'?'selected':''}>Hadir/Alpa saja</option><option value="telat" ${a.jenis==='telat'?'selected':''}>Hadir/Telat/Izin/Sakit/Alpa</option></select></label>
 <label>Piket<select data-f="shift"><option value="pagi" ${a.shift==='pagi'?'selected':''}>Piket Pagi</option><option value="malam" ${a.shift==='malam'?'selected':''}>Piket Malam</option></select></label>
 <label>Sorot di Beranda<select data-f="sorot"><option value="" ${a.sorot==='1'?'':'selected'}>Tidak</option><option value="1" ${a.sorot==='1'?'selected':''}>Ya (hanya yang tidak hadir)</option></select></label>
 <label style="flex:1">Kartu kuning otomatis<input data-f="auto" value="${esc(a.auto||'')}" placeholder="Nama kategori (kosongkan jika tidak ada)"></label></div></div>`).join('');
 $('#mb').innerHTML=`${pend.length?`<div class="bn yel"><b>Nama lama terdeteksi.</b> <span>Ngaji → Tadarus, Belajar Malam → Belajar Mandiri. Riwayat absensi ikut dipindahkan.</span><div style="margin-top:8px"><button class="btn pri" id="gleg">Terapkan nama baru</button></div></div>`:''}<div class="tip">Atur kegiatan absensi: tambah, hapus, ubah urutan, jenis, dan piket. Menghapus kegiatan tidak menghapus riwayat absensinya. Kartu kuning otomatis berlaku untuk Telat dan Alpa pada kegiatan sholat, dan untuk Alpa pada kegiatan biasa.</div>${!ACTN().includes('Keberangkatan Sekolah')||!ACTN().includes('Pengumpulan HP Pagi')?'<div style="margin:0 0 10px"><button class="btn pri" id="gq">＋ Tambah Keberangkatan Sekolah &amp; Pengumpulan HP Pagi</button></div>':''}<div style="margin:0 0 10px"><button class="btn sec" id="gord">Urutkan sesuai jadwal harian</button></div><p class="mut">Untuk mengganti nama kegiatan, ketuk nama di kartu lalu ubah. Riwayat absensinya ikut pindah ke nama baru.</p>
 <div class="card"><div class="row" style="margin:0"><label style="flex:1">Nama kegiatan<input id="gn"></label><label>Jenis<select id="gj"><option value="sholat">Sholat</option><option value="biasa" selected>Biasa</option><option value="dua">Hadir/Alpa saja</option><option value="telat">Hadir/Telat/Izin/Sakit/Alpa</option></select></label>
 <label>Piket<select id="gs"><option value="pagi">Piket Pagi</option><option value="malam" selected>Piket Malam</option></select></label>
 <label>Sorot di Beranda<select id="gh"><option value="">Tidak</option><option value="1">Ya (hanya yang tidak hadir)</option></select></label></div>
 <div class="row" style="margin:10px 0 0"><label style="flex:1">Kartu kuning otomatis<input id="ga" placeholder="Nama kategori (kosongkan jika tidak ada)"></label><button class="btn pri" id="gadd">Tambah</button></div></div>${rows}`;
 $('#gadd').onclick=()=>{const n=$('#gn').value.trim();if(!n){toast('Isi nama kegiatan');return}
  if(ACTN().some(x=>x.toLowerCase()===n.toLowerCase())){toast('Nama kegiatan sudah ada');return}
  matAct();const a={id:nid(),nama:n,jenis:$('#gj').value,shift:$('#gs').value,auto:$('#ga').value.trim(),sorot:$('#gh').value,urut:Math.max(-1,...db.acts.map(x=>x.urut||0))+1};
  db.acts.push(a);sync([saveAct(a)]);fKeg();toast('Kegiatan ditambahkan')};
 const nm=el=>el.closest('[data-n]').dataset.n;
 $('#mb').querySelectorAll('[data-rn]').forEach(i=>i.onchange=()=>{const old=nm(i),v=i.value.trim();
  if(!v||v===old){i.value=old;return}
  if(ACTN().some(x=>x!==old&&x.toLowerCase()===v.toLowerCase())){toast('Nama kegiatan sudah ada');i.value=old;return}
  if(!confirm('Ubah nama kegiatan ini? Riwayat absensinya ikut dipindahkan ke nama baru.')){i.value=old;return}
  renameAct(old,v);fKeg();toast('Nama kegiatan diubah')});
 if($('#gq'))$('#gq').onclick=()=>{matAct();let u=Math.max(-1,...db.acts.map(x=>x.urut||0));const it=[['Pengumpulan HP Pagi'],['Keberangkatan Sekolah']].filter(([n])=>!ACTN().includes(n)).map(([n])=>{const a={id:nid(),nama:n,jenis:'telat',shift:'pagi',auto:'',sorot:'1',urut:++u};db.acts.push(a);return saveAct(a)});sync(it);fKeg();toast('Kegiatan ditambahkan')};
 if($('#gord'))$('#gord').onclick=()=>{if(!confirm('Urutkan kegiatan sesuai jadwal harian (Subuh sampai Absensi Malam)?'))return;orderActs();fKeg();toast('Urutan kegiatan diperbarui')};
 if($('#gleg'))$('#gleg').onclick=()=>{if(!confirm('Terapkan nama baru? Riwayat absensinya ikut dipindahkan.'))return;pend.forEach(a=>renameAct(a.nama,LEG[a.nama]));fKeg();toast('Nama kegiatan diperbarui')};
 $('#mb').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{moveAct(nm(b),-1);fKeg()});
 $('#mb').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{moveAct(nm(b),1);fKeg()});
 $('#mb').querySelectorAll('[data-kdel2]').forEach(b=>b.onclick=()=>{if(confirm('Hapus kegiatan ini? Riwayat absensinya tetap tersimpan.')){const a=actByName(nm(b));db.acts=db.acts.filter(x=>x!==a);sync([{key:'e:'+a.id,value:null}]);fKeg()}});
 $('#mb').querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{const a=actByName(nm(i));a[i.dataset.f]=i.value.trim();sync([saveAct(a)])});
}

/* data siswa */
let EDS=null;
function fSiswa(){
 $('#mb').innerHTML=`<div class="row"><label>Nama<input id="sn"></label><label>Kelas<input id="sc" size="5" placeholder="11A"></label><label>Kamar<input id="sm" size="5" placeholder="A-01"></label><button class="btn pri" id="sadd">Tambah</button></div>
 <details class="card"><summary>Tambah banyak sekaligus</summary><p class="mut">Satu siswa per baris: Nama, Kelas, Kamar</p><textarea id="sbt" rows="5" style="width:100%" placeholder="Ahmad Fauzan, 11A, A-01"></textarea><p><button class="btn sec" id="sbulk">Tambah semua</button></p></details>
 <div class="tw"><table style="min-width:0"><tr><th>Nama</th><th>Kelas</th><th>Kamar</th><th></th></tr>
 ${db.students.map(s=>s.id===EDS?`<tr><td><input id="en" value="${esc(s.nama)}" style="width:100%"></td><td><input id="ec" value="${esc(s.kelas)}" size="4"></td><td><input id="em" value="${esc(s.kamar||'')}" size="5"></td><td><button class="btn pri" id="esv">Simpan</button> <button class="btn" id="ecn">Batal</button></td></tr>`:`<tr><td>${esc(s.nama)}</td><td>${esc(s.kelas)}</td><td>${esc(s.kamar||'')}</td><td><button class="btn" data-eedit="${s.id}">Edit</button> <button class="btn del" data-del="${s.id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada data.</td></tr>'}</table></div>`;
 $('#sadd').onclick=()=>{const n=$('#sn').value.trim(),c=$('#sc').value.trim().toUpperCase(),m=$('#sm').value.trim().toUpperCase();
  if(!n||!c){toast('Nama dan kelas wajib diisi');return}addStu([[n,c,m]]);fSiswa();toast('Siswa ditambahkan')};
 $('#sbulk').onclick=()=>{const L=$('#sbt').value.split('\n').map(x=>x.split(/[,;\t]/).map(y=>y.trim())).filter(x=>x[0]&&x[1]).map(x=>[x[0],x[1].toUpperCase(),(x[2]||'').toUpperCase()]);
  if(!L.length){toast('Format: Nama, Kelas, Kamar');return}addStu(L);fSiswa();toast(L.length+' siswa ditambahkan')};
 $('#mb').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Hapus siswa ini beserta semua data absensi dan kartunya?')){delStu(b.dataset.del);if(EDS===b.dataset.del)EDS=null;fSiswa()}});

 ss.forEach(s=>{const o=stats(s.id,R.from,R.to,R.act),kc=cstat(s.id,R.from,R.to);sum.push([s.nama,s.kelas,s.kamar,o.ok,o.Telat,o.Izin,o.Sakit,o.Alpa,o.tot,o.tot?Math.round(o.ok/o.tot*100)/100:'',kc[0],kc[1],poin(s.id,R.from,R.to),(()=>{const q=roomStat(s.kamar,R.from,R.to);return q?Math.round(q.avg*10)/10:''})()]);});
 const det=[['Tanggal','Kegiatan','Nama','Kelas','Kamar','Status','Catatan','Piket']];
 Object.keys(db.att).sort().forEach(k=>{const p=k.split('|');if(!ids.has(p[2])||p[0]<R.from||p[0]>R.to||(R.act&&p[1]!==R.act))return;
  const s=db.students.find(x=>x.id===p[2]),r=db.att[k];det.push([p[0],p[1],s.nama,s.kelas,s.kamar,r.s,r.n||'',r.by||pkTxt(p[0])]);});
 const pik=[['Tanggal','Piket Pagi','Piket Malam']];Object.keys(db.piket).sort().forEach(d=>{if(d>=R.from&&d<=R.to)pik.push([d,pkv(d,0),pkv(d,1)])});
 const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(sum);
 w1['!cols']=[{wch:22},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12}];
 for(let r=2;r<=sum.length;r++){const c=w1['J'+r];if(c&&c.v!=='')c.z='0%'}
 const w2=XLSX.utils.aoa_to_sheet(det);w2['!cols']=[{wch:12},{wch:16},{wch:22},{wch:8},{wch:8},{wch:10},{wch:30},{wch:20}];
 const w3=XLSX.utils.aoa_to_sheet(pik);w3['!cols']=[{wch:12},{wch:24},{wch:24}];
 const krt=[['Date','Name','Class','Type','Category','Note','Supervisor','Points']];
 db.cards.filter(c=>ids.has(c.sid)&&c.tgl>=R.from&&c.tgl<=R.to).sort((a,b)=>a.tgl.localeCompare(b.tgl)).forEach(c=>{const s=db.students.find(x=>x.id===c.sid);krt.push([c.tgl,s.nama,s.kelas,c.tipe==='kuning'?'Yellow':'Green',c.kat,c.n||'',c.by||'',pt(c)])});
 const w4=XLSX.utils.aoa_to_sheet(krt);w4['!cols']=[{wch:12},{wch:22},{wch:8},{wch:8},{wch:24},{wch:30},{wch:20},{wch:8}];
 XLSX.utils.book_append_sheet(wb,w1,'Rekap');XLSX.utils.book_append_sheet(wb,w2,'Detail');XLSX.utils.book_append_sheet(wb,w3,'Piket');XLSX.utils.book_append_sheet(wb,w4,'Cards');
 XLSX.writeFile(wb,'rekap-asrama_'+R.from+'_'+R.to+'.xlsx');toast('File Excel diunduh');
}

/* ---------- monitoring siswa ---------- */
const MPER={per:(['w1','w2','m1','all'].includes(LS('per'))?LS('per'):'w2'),off:0};
function exportSiswa(s,f,t){
 if(typeof XLSX==='undefined'){toast('Library Excel belum termuat. Coba saat online.');return}
 const rr=roomOf(s.kamar),rsm=rr?roomStat(s.kamar,f,t):null;
 const A1=[['Nama',s.nama],['Kelas',s.kelas],['Kamar',s.kamar||''],['Periode',f+' → '+t],['Nilai Kamar',rsm?Math.round(rsm.avg*10)/10:''],[],['Kegiatan','Hadir','Telat','Izin','Sakit','Alpa','Total']];
 ACTN().forEach(a=>{const o=stats(s.id,f,t,a);A1.push([a,o.ok,o.Telat,o.Izin,o.Sakit,o.Alpa,o.tot])});
 const cs=db.cards.filter(c=>c.sid===s.id&&c.tgl>=f&&c.tgl<=t).sort((a,b)=>a.tgl.localeCompare(b.tgl));
 const K1=[['Date','Type','Category','Points','Note'],...cs.map(c=>[c.tgl,c.tipe==='kuning'?'Yellow':'Green',c.kat,pt(c),c.n||''])];
 const wb=XLSX.utils.book_new(),W=(r,w)=>{const x=XLSX.utils.aoa_to_sheet(r);x['!cols']=w.map(n=>({wch:n}));return x};
 XLSX.utils.book_append_sheet(wb,W(A1,[18,14,8,8,8,8,8]),'Rekap');XLSX.utils.book_append_sheet(wb,W(K1,[12,8,28,8,40]),'Cards');
 XLSX.writeFile(wb,'rekap-'+s.nama.replace(/[^A-Za-z0-9]+/g,'_')+'_'+f+'_'+t+'.xlsx');toast('File Excel diunduh');
}
function monitor(){
 if(!monSel||!db.students.some(s=>s.id===monSel))monSel=(db.students[0]||{}).id||'';
 const s=db.students.find(x=>x.id===monSel),pr=perRange(MPER.per,MPER.off),f=pr.from,t=pr.to;
 if(MD&&(MD<f||MD>t))MD='';
 const inD=d=>!MD||d===MD;
 let body='<div class="empty">Belum ada siswa.</div>';
 if(s){
  const per=ACTN().map(a=>{const o=stats(s.id,f,t,a),p=o.tot?Math.round(o.ok/o.tot*100):0;
   return `<tr><td>${a}</td><td>${o.ok}/${o.tot}</td><td><div class="bar"><i style="width:${p}%"></i></div></td></tr>`}).join('');
  const cs=db.cards.filter(c=>c.sid===s.id&&c.tgl>=f&&c.tgl<=t).sort((a,b)=>b.tgl.localeCompare(a.tgl)),ky=cs.filter(c=>c.tipe==='kuning').length;
  const lr=lbRank(s.id,f,t),rr=roomOf(s.kamar),rsm=rr?roomStat(s.kamar,f,t):null;
  const roomHtml='<h3>Nilai kamar</h3>'+(rr?`<div class="g3"><div class="card"><div class="big" style="font-size:1.1rem;padding:.3rem 0">${esc(rr.no)}</div><div class="mut">Kamar</div></div><div class="card"><div class="big">${rsm?rsm.avg.toFixed(1):'-'}</div><div class="mut">Rata-rata nilai kamar</div></div><div class="card"><div class="big">${rsm?rsm.last+'/'+MAXC:'-'}</div><div class="mut">Pemeriksaan terakhir</div></div></div>`:'<div class="bn">Nomor kamar siswa belum terdaftar di daftar kamar (Input Data → Kebersihan).</div>');
  const AN=ACTN(),lk=Object.keys(db.att).filter(k=>{const q=k.split('|');return q[2]===s.id&&q[0]>=f&&q[0]<=t&&inD(q[0])}).sort((x,y)=>{const p=x.split('|'),q=y.split('|');return q[0].localeCompare(p[0])||AN.indexOf(p[1])-AN.indexOf(q[1])}),lnum=lk.length;
  const last=lk.map(k=>{const q=k.split('|'),r=db.att[k];
   return `<tr><td>${q[0]}</td><td>${q[1]}</td><td>${r.s}</td><td>${esc(r.n||'')}</td><td><button class="btn" data-maedit="${esc(q[0]+'|'+q[1])}">Edit</button></td></tr>`}).join('');
  body=`${lr?`<div class="bn ${lr.k==='low'?'yel':'ok'}" data-nt>${lr.k==='low'?'🟡 <b>Top 10 · lowest points</b> · this period':'🟢 <b>Top 20 · highest points</b> · this period'}</div>`:''}
  <div class="card"><div class="nm" style="font-size:1rem">${esc(s.nama)}</div><div class="mut">Kelas ${esc(s.kelas)} · Kamar ${esc(s.kamar||'-')}</div></div>
  <div class="tw"><table><tr><th>Kegiatan</th><th>Hadir</th><th>Progres</th></tr>${per}</table></div>
  ${roomHtml}
  <div data-nt><h3>Cards</h3>
  <div class="g3"><div class="card ky"><div class="big">${ky}</div><div class="mut">🟨 Yellow Card</div></div><div class="card hj"><div class="big">${cs.length-ky}</div><div class="mut">🟩 Green Card</div></div><div class="card"><div class="big">${fp(poin(s.id,f,t))}</div><div class="mut">Total points</div></div></div>
  <div class="tw"><table><tr><th>Date</th><th>Type</th><th>Category</th><th>Points</th><th>Note</th><th></th></tr>${cs.filter(c=>inD(c.tgl)).map(c=>`<tr><td>${c.tgl}</td><td>${jenis(c.tipe)}</td><td>${esc(c.kat)}</td><td>${fp(pt(c))}</td><td>${esc(c.n||'')}</td><td>${String(c.id).startsWith('auto|')?'<span class="mut">Auto</span>':`<button class="btn" data-mkedit="${esc(c.id)}">Edit</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No cards yet.</td></tr>'}</table></div></div>
  <h3>Catatan ${MD?'tanggal '+esc(MD):'periode ini'} · ${lnum} catatan</h3>
  <div class="tw"><table><tr><th>Tanggal</th><th>Kegiatan</th><th>Status</th><th>Catatan</th><th></th></tr>${last||'<tr><td colspan="5" class="empty">Belum ada catatan.</td></tr>'}</table></div>`;
 }
 $('#view').innerHTML=`<h2>Monitoring Siswa</h2><div class="row"><label>Pilih Siswa<select id="s" style="min-width:200px">${db.students.map(x=>`<option value="${x.id}" ${x.id===monSel?'selected':''}>${esc(x.nama)} (${esc(x.kelas)})</option>`).join('')}</select></label>
 <label>Periode<select id="mp"><option value="w1">1 minggu</option><option value="w2">2 minggu</option><option value="m1">1 bulan</option><option value="all">Semua</option></select></label>${MPER.per==='all'?'':`<button class="btn" id="mprev">◀</button><button class="btn" id="mnext" ${MPER.off>=0?'disabled':''}>▶</button>`}<label>Tanggal<input type="date" id="md" value="${MD}"${MPER.per==='all'?'':` min="${f}" max="${t}"`}></label>${MD?'<button class="btn sec" id="mdx">Semua tanggal</button>':''}</div>
 <p class="mut"><b>Rekap per siswa</b> · ${f} → ${t}</p>${s?'<div class="row"><button class="btn sec" id="msx">⬇ Unduh rekap siswa (Excel)</button></div>':''}${body}`;
 const sel=$('#s');if(sel)sel.onchange=e=>{monSel=e.target.value;monitor()};
 $('#mp').value=MPER.per;$('#mp').onchange=e=>{MPER.per=e.target.value;MPER.off=0;LS('per',MPER.per);monitor()};
 if($('#mprev')){$('#mprev').onclick=()=>{MPER.off--;monitor()};$('#mnext').onclick=()=>{MPER.off++;monitor()}}
 $('#md').onchange=e=>{MD=e.target.value||'';monitor()};if($('#mdx'))$('#mdx').onclick=()=>{MD='';monitor()};
 if($('#msx'))$('#msx').onclick=()=>exportSiswa(s,f,t);
 $('#view').querySelectorAll('[data-maedit]').forEach(b=>b.onclick=()=>{const q=b.dataset.maedit.split('|');A.date=q[0];A.act=q[1];A.kelas=s.kelas;loadDraft();openM('Absensi')});
 $('#view').querySelectorAll('[data-mkedit]').forEach(b=>b.onclick=()=>{K.edit=b.dataset.mkedit;K.f=s.id;openM('Kartu')});
}

/* ---------- mulai ---------- */
function boot(){db.students.sort(stuCmp);normAll();$('#out').hidden=false;$('#fab').hidden=false;setSt();go();pull()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('online',()=>{online=true;pull()});
addEventListener('offline',()=>{online=false;setSt()});
setInterval(pull,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
renderFooter();document.documentElement.lang=lang;document.title=tx('Monitoring Asrama');applyAll();
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNode))).observe(document.body,{childList:true,subtree:true});
if(code)boot();else showLogin('');
</script>
